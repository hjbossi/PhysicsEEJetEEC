# Regenerate the publication figure on every push / pull request.
# The figure, the PDF, the bin table and the executed notebook are uploaded
# as a build artifact ("eec_full_range") on the workflow run page.
name: EEC plot

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  plot:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install LaTeX for matplotlib text rendering
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            texlive-latex-base texlive-latex-extra texlive-fonts-recommended \
            cm-super dvipng ghostscript

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Execute the notebook
        run: |
          jupyter nbconvert --to notebook --execute \
            --ExecutePreprocessor.timeout=900 \
            --output-dir plots --output EEC_Plot_Pub_ALEPH_executed.ipynb \
            script/EEC_Plot_Pub_ALEPH.ipynb

      - name: Check that the figure was produced
        run: |
          ls -l plots/eec_full_range.png plots/eec_full_range.pdf plots/eec_full_range_points.txt
          python - <<'PY'
          from pathlib import Path
          png = Path("plots/eec_full_range.png")
          assert png.stat().st_size > 10_000, "PNG suspiciously small"
          print("OK", png, png.stat().st_size, "bytes")
          PY

      - name: Upload figure
        uses: actions/upload-artifact@v4
        with:
          name: eec_full_range
          path: |
            plots/eec_full_range.png
            plots/eec_full_range.pdf
            plots/eec_full_range_points.txt
            plots/EEC_Plot_Pub_ALEPH_executed.ipynb
          if-no-files-found: error
          retention-days: 90
